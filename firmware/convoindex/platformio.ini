; ConvoIndex Phase 1 firmware — LAFVIN AI Chatbot board (ESP32-S3 + ES8311/ES7210 shield)
; Reuses the exact I2S/I2C pinout documented in xiaozhi-esp32-main/main/boards/lafvin-aichatbot
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = default.csv

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DAUDIO_DRIVER_LOG_LEVEL=0
    -std=gnu++17
build_unflags =
    -std=gnu++11

lib_deps =
    links2004/WebSockets @ ^2.4.1
    https://github.com/pschatzmann/arduino-audio-driver.git
    adafruit/Adafruit NeoPixel @ ^1.12.3
